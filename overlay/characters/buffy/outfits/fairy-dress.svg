    <!-- leaf-petal neckline -->
    <path d="M208 386 Q226 402 238 390 Q248 410 256 400 Q264 410 274 390 Q286 402 304 386"
      fill="none" stroke="#fff8e8" stroke-width="7" stroke-linecap="round"/>
    <g fill="#9fc99b" stroke="#5c6f4d" stroke-width="1.8">
      <path d="M232 390 Q240 378 250 384 Q246 396 236 396 Z"/>
      <path d="M280 390 Q272 378 262 384 Q266 396 276 396 Z"/>
    </g>
    <!-- flutter sleeves -->
    <path d="M184 404 C162 412 148 430 154 446 C170 452 188 438 196 422 Z"
      fill="#ead3f5" opacity="0.9" stroke="#5c3150" stroke-width="5"/>
    <path d="M328 404 C350 412 364 430 358 446 C342 452 324 438 316 422 Z"
      fill="#ead3f5" opacity="0.9" stroke="#5c3150" stroke-width="5"/>
    <!-- waist flower -->
    <g transform="translate(256 456)">
      <ellipse cx="-15" cy="-4" rx="10" ry="6" fill="#f6c1d8" stroke="#5c3150" stroke-width="3" transform="rotate(-24)"/>
      <ellipse cx="15" cy="-4" rx="10" ry="6" fill="#f6c1d8" stroke="#5c3150" stroke-width="3" transform="rotate(24)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="10" fill="#f8d6e3" stroke="#5c3150" stroke-width="3"/>
      <ellipse cx="0" cy="4" rx="8" ry="7" fill="#efb0cc" stroke="#5c3150" stroke-width="3"/>
      <circle cx="0" cy="-1" r="4.5" fill="#f4d27a" stroke="#8a6224" stroke-width="2"/>
    </g>
    <!-- tiny sparkles around the skirt -->
    <g fill="#fff1bf">
      <path d="M188 482 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"/>
      <path d="M324 498 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
      <circle cx="210" cy="556" r="2.5"/>
      <circle cx="302" cy="556" r="2"/>
    </g>
  </g>
</svg>
