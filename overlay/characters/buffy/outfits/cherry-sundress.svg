    <!-- red Mary Janes -->
    <ellipse cx="204" cy="574" rx="29" ry="15" fill="#b83350" stroke="#5c3150" stroke-width="6"/>
    <ellipse cx="308" cy="574" rx="29" ry="15" fill="#b83350" stroke="#5c3150" stroke-width="6"/>
    <path d="M178 568 Q204 580 230 568 M282 568 Q308 580 334 568" fill="none" stroke="#fff7ea" stroke-width="4" stroke-linecap="round"/>
    <path d="M186 560 L192 548 M326 560 L320 548" fill="none" stroke="#b83350" stroke-width="5" stroke-linecap="round"/>
