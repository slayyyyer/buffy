<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
  <defs>
    <linearGradient id="cherryFabric" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ef7288"/>
      <stop offset="0.58" stop-color="#db506b"/>
      <stop offset="1" stop-color="#b83350"/>
