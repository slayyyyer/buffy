      <circle cx="0" cy="1" r="6" fill="#c52d49" stroke="#7f1f33" stroke-width="2"/>
      <circle cx="14" cy="3" r="5" fill="#c52d49" stroke="#7f1f33" stroke-width="2"/>
      <path d="M0 -5 C2 -12 8 -16 14 -15 M14 -2 C17 -10 22 -13 26 -12" fill="none" stroke="#6f8d52" stroke-width="2.5" stroke-linecap="round"/>
