    <path d="M258 456 C278 468 288 484 284 500" fill="none" stroke="#fff7ea" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 456 C238 470 230 486 234 500" fill="none" stroke="#fff7ea" stroke-width="4" stroke-linecap="round"/>
    <path d="M232 500 Q240 494 246 502 Q240 510 232 500 Z M276 500 Q284 494 290 502 Q284 510 276 500 Z"
