    <path d="M210 380 Q232 398 256 382 Q280 398 302 380" fill="none" stroke="#f3cbd3" stroke-width="2.5" stroke-linecap="round"/>
    <!-- thin shoulder straps -->
    <path d="M210 382 C208 366 212 352 220 344 M302 382 C304 366 300 352 292 344"
