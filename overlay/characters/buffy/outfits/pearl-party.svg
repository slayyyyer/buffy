    <ellipse cx="204" cy="578" rx="28" ry="14" fill="#f5e3cd" stroke="#5c3150" stroke-width="6"/>
    <ellipse cx="308" cy="578" rx="28" ry="14" fill="#f5e3cd" stroke="#5c3150" stroke-width="6"/>
    <path d="M178 574 Q204 586 230 574 M282 574 Q308 586 334 574" fill="none" stroke="#fff9ec" stroke-width="4" stroke-linecap="round"/>
