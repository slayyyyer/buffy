<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
  <defs>
    <linearGradient id="pearlSatin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.58" stop-color="#f5e6d1"/>
      <stop offset="1" stop-color="#dfc5ab"/>
    </linearGradient>
    <linearGradient id="pearlTulle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8d3bd" stop-opacity="0.55"/>
