name: Test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  packaging:
    name: Cask matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the cask against package.json
        run: node scripts/check-cask.js

  cask:
    name: Homebrew cask
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the cask parses as Ruby
        shell: bash
        run: |
          set -euo pipefail
          ruby -v
          for file in Casks/*.rb; do
            ruby -c "$file"
          done

      - name: Load the cask through Homebrew
        shell: bash
        # Job logs need repo-admin access to read, so every failure is also
        # raised as an annotation where anyone can see what went wrong.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          set -uo pipefail

          die() {
            echo "::error title=Homebrew refused the cask::$1"
            exit 1
          }

          brew tap-new slayyyyer/buffy-ci >/dev/null 2>tap.err || die "tap-new: $(tr '\n' '|' < tap.err | tail -c 400)"
          tap="$(brew --repository slayyyyer/buffy-ci)" || die "could not resolve the tap path"
          # tap-new only scaffolds Formula/, so Casks/ has to exist before the copy.
          mkdir -p "$tap/Casks" || die "could not create $tap/Casks"
          cp Casks/buffy.rb "$tap/Casks/buffy.rb" || die "could not copy the cask into $tap"
          # Homebrew will not load a cask from an untrusted third-party tap.
          brew trust slayyyyer/buffy-ci >trust.out 2>trust.err || die "brew trust: $(tr '\n' '|' < trust.err | tail -c 400)"
          brew info --cask slayyyyer/buffy-ci/buffy >info.out 2>info.err || die "brew info: $(tr '\n' '|' < info.err | tail -c 400)"
          cat info.out

      - name: Check the cask style
        shell: bash
        run: brew style Casks/buffy.rb
