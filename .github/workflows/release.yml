name: Build and publish release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Match tag to package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build: npm run dist:win
            artifact: windows-x64
          - name: macOS x64 and arm64
            os: macos-latest
            build: npm run dist:mac
            artifact: macos
          - name: Linux x64
            os: ubuntu-latest
            build: npm run dist:linux
            artifact: linux-x64
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -n "${WIN_CSC_LINK:-}" ]]; then export CSC_LINK="$WIN_CSC_LINK"; fi
            if [[ -n "${WIN_CSC_KEY_PASSWORD:-}" ]]; then export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ -n "${MAC_CSC_LINK:-}" ]]; then export CSC_LINK="$MAC_CSC_LINK"; fi
            if [[ -n "${MAC_CSC_KEY_PASSWORD:-}" ]]; then export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"; fi
          fi
          ${{ matrix.build }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged

      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buffy-${{ matrix.artifact }}-installers
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: buffy-*-installers
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -printf '%f\n' | sort)
          expected=4
          if (( ${#installers[@]} != expected )); then
            echo "Expected $expected installers, found ${#installers[@]}:" >&2
            printf '  %s\n' "${installers[@]}" >&2
            exit 1
          fi
          for file in "${installers[@]}"; do
            sha256sum "$file" > "$file.sha256"
          done
          sha256sum --check --strict ./*.sha256
          echo "Prepared release assets:"
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Adding assets to existing release $tag"
          else
            gh release create "$tag" --title "Buffy $tag" --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber
