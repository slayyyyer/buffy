name: Cask install

# The other workflows prove the cask parses. This one downloads the release dmg,
# installs it the way a user would, and checks what actually landed. It costs a
# ~120 MB download and a macOS runner, so it runs only when the cask changes.

on:
  workflow_dispatch:
  push:
    paths:
      - "Casks/**"
      - ".github/workflows/cask-install.yml"
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/cask-install.yml"

permissions:
  contents: read

concurrency:
  group: cask-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install from the cask
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the checked-out cask
        shell: bash
        # A temporary tap holds the cask from this commit, so a pull request is
        # tested rather than whatever is already on main.
        run: |
          set -euo pipefail
          brew tap-new slayyyyer/buffy-ci >/dev/null
          tap="$(brew --repository slayyyyer/buffy-ci)"
          mkdir -p "$tap/Casks"
          cp Casks/buffy.rb "$tap/Casks/buffy.rb"
          brew trust slayyyyer/buffy-ci
          # brew verifies sha256 itself before unpacking, so a mismatch fails here.
          brew install --cask slayyyyer/buffy-ci/buffy

      - name: Confirm Buffy.app landed
        shell: bash
        run: |
          set -euo pipefail

          die() { echo "::error title=Install check failed::$1"; exit 1; }

          app="/Applications/Buffy.app"
          [ -d "$app" ] || die "$app is missing after the install"
          [ -x "$app/Contents/MacOS/Buffy" ] || die "the app bundle has no Buffy executable"

          expected="$(node -p "require('./package.json').version")"
          installed="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          [ "$installed" = "$expected" ] || die "installed $installed, expected $expected"
          echo "installed Buffy $installed"

      - name: Confirm the downloaded dmg matches its published hash
        shell: bash
        run: |
          set -euo pipefail

          die() { echo "::error title=Checksum check failed::$1"; exit 1; }

          case "$(uname -m)" in
            arm64)  key="arm";   slug="mac-arm64" ;;
            x86_64) key="intel"; slug="mac-x64" ;;
            *) die "unexpected architecture $(uname -m)" ;;
          esac

          version="$(node -p "require('./package.json').version")"
          url="https://github.com/slayyyyer/buffy/releases/download/v${version}/Buffy-${version}-${slug}.dmg"

          # Homebrew verifies sha256 before installing, so the install above is
          # already a match. This re-derives the checksum from the bytes on disk,
          # preferring Homebrew's own download and fetching the release artifact
          # only when the cache has already been cleaned out.
          dmg="$(find "$(brew --cache)" -type f -name '*.dmg' | head -1 || true)"
          if [ -n "$dmg" ]; then
            echo "using Homebrew's download: $dmg"
          else
            echo "no dmg under $(brew --cache); fetching $url"
            dmg="$(mktemp -t buffy).dmg"
            curl -fL --retry 3 -o "$dmg" "$url" || die "could not download $url"
          fi

          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"

          # The cask's own value for this architecture.
          cask_hash="$(grep -oE "${key}: *\"[0-9a-f]{64}\"" Casks/buffy.rb | grep -oE "[0-9a-f]{64}" || true)"
          [ -n "$cask_hash" ] || die "could not read the $key hash out of the cask"

          published="$(curl -fsSL "${url}.sha256" | awk '{print $1}')"

          [ "$actual" = "$cask_hash" ] || die "dmg ($actual) does not match the cask ($cask_hash)"
          [ "$actual" = "$published" ] || die "dmg ($actual) does not match the published checksum ($published)"
          echo "dmg $(basename "$dmg") sha256 $actual matches the cask and the release"

      - name: Uninstall, since a zap leaves user data
        shell: bash
        continue-on-error: true
        run: brew uninstall --cask slayyyyer/buffy-ci/buffy
